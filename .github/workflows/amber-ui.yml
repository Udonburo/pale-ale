name: Amber UI

on:
  push:
    branches:
      - main
    paths:
      - "apps/trace-triage-demo/src/**"
      - "apps/trace-triage-demo/public/**"
      - "apps/trace-triage-demo/package.json"
      - "apps/trace-triage-demo/package-lock.json"
      - "apps/trace-triage-demo/index.html"
      - "apps/trace-triage-demo/tsconfig*.json"
      - "apps/trace-triage-demo/vite.config.*"
      - "apps/trace-triage-demo/vercel.json"
      - ".github/workflows/amber-ui.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/trace-triage-demo/src/**"
      - "apps/trace-triage-demo/public/**"
      - "apps/trace-triage-demo/package.json"
      - "apps/trace-triage-demo/package-lock.json"
      - "apps/trace-triage-demo/index.html"
      - "apps/trace-triage-demo/tsconfig*.json"
      - "apps/trace-triage-demo/vite.config.*"
      - "apps/trace-triage-demo/vercel.json"
      - ".github/workflows/amber-ui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/trace-triage-demo
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/trace-triage-demo/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Amber
        run: npm run build
