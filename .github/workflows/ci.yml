name: Core CI

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/eval_triality_token.py"
      - "tools/validate_gate4_parity.py"
      - "tools/run_gate4_fixture_parity.py"
      - "fixtures/gate4/**"
      - "specs/internal/SPEC.internal.draft.md"
      - "docs/gate4_feature_contract_draft.md"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/eval_triality_token.py"
      - "tools/validate_gate4_parity.py"
      - "tools/run_gate4_fixture_parity.py"
      - "fixtures/gate4/**"
      - "specs/internal/SPEC.internal.draft.md"
      - "docs/gate4_feature_contract_draft.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # Keep the retained Rust surface and its bounded Gate4 fixture on one runner
    # so Gate4 reuses the workspace compilation instead of rebuilding it elsewhere.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --workspace

      - name: Gate4 Python sanity
        run: python -m py_compile tools/eval_triality_token.py tools/validate_gate4_parity.py tools/run_gate4_fixture_parity.py

      - name: Gate4 fixture parity
        run: python tools/run_gate4_fixture_parity.py
