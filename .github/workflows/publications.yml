name: Publication Catalog

on:
  push:
    branches:
      - main
    paths:
      - "publications/**"
      - ".github/workflows/publications.yml"
  pull_request:
    branches:
      - main
    paths:
      - "publications/**"
      - ".github/workflows/publications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate catalog and frozen package checksums
        run: python publications/validate_catalog.py
