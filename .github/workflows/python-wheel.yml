name: Python wheel

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "LICENSE"
      - ".github/workflows/python-wheel.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "LICENSE"
      - ".github/workflows/python-wheel.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # This wheel packages only the root crate; workspace-crate-only changes do not
    # need to rebuild it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install wheel build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        shell: bash
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          echo "wheel=$WHEEL"
          python -m pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify module import and symbols
        run: |
          python - <<'PY'
          import pale_ale_core

          required = {"spin3_distance", "spin3_struct", "spin3_components", "spin3_struct_distance"}
          got = {name for name in dir(pale_ale_core) if name.startswith("spin3_")}
          missing = sorted(required - got)
          print("core_path=", pale_ale_core.__file__)
          print("symbols=", sorted(got))
          if missing:
              raise SystemExit(f"missing symbols: {missing}")
          PY
