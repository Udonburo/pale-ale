name: Binary Array-RQMC

on:
  push:
    branches: [main]
    paths:
      - "papers/binary-array-rqmc/**"
      - "publications/binary-array-rqmc/**"
      - ".gitattributes"
      - ".github/workflows/binary-array-rqmc.yml"
  pull_request:
    branches: [main]
    paths:
      - "papers/binary-array-rqmc/**"
      - "publications/binary-array-rqmc/**"
      - ".gitattributes"
      - ".github/workflows/binary-array-rqmc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The companion does not depend on historical workstream files, some
          # of whose names exceed Windows' default checkout path limit.
          sparse-checkout: |
            papers
            publications
            docs/release

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: papers/binary-array-rqmc/repro/requirements.txt

      - name: Install pinned scientific dependencies
        run: python -m pip install -r papers/binary-array-rqmc/repro/requirements.txt

      - name: Test the browsable source companion
        run: python -m unittest discover -s papers/binary-array-rqmc/repro -v

      - name: Check archived publication checksums
        run: python publications/validate_catalog.py

      - name: Extract the published capsule into a separate directory
        run: python -m zipfile -e publications/binary-array-rqmc/zenodo/reproducibility-capsule.zip "$RUNNER_TEMP/binary-array-rqmc-capsule"

      - name: Test the published capsule without private workspace data
        run: python -m unittest discover -s "$RUNNER_TEMP/binary-array-rqmc-capsule/binary-array-rqmc/repro" -v
